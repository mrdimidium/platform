[package]
name = "dimidiumlabs-ui-build"
description = "Build-script support for Dimidium Labs service stylesheets and scripts"
version.workspace = true

authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
brotli = "8"
flate2 = "1"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
oxc = { version = "=0.148.0", default-features = false, features = ["codegen", "mangler", "minifier", "semantic", "transformer"] }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
tempfile = "3.24.0"
