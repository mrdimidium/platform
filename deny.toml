[licenses]
version = 2
# Build-only Lightning CSS and Oxc dependencies also use permissive ISC/BSD/BSL terms and
# file-level MPL-2.0. Keep accepted licenses explicit rather than maintaining crate exceptions.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "OFL-1.1",
  "Unicode-3.0",
  "Zlib",
]
